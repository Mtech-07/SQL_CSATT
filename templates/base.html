<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQL Injection Controlled Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-link navbar-brand text-warning fw-bold" href="#">SQLi Lab Baseline</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    {% if session.get('logged_in') %}
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search">Demo 3: Data Theft</a></li>
                    <li class="nav-item"><a class="nav-link" href="/manage">Demo 2: Data Modification</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logs">Demo 4: Security Logs</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
                    {% endif %}
                </ul>
                <form action="/toggle-security" method="POST" class="d-flex">
                    <button type="submit" class="btn {% if mode == 'VULNERABLE' %}btn-danger{% else %}btn-success{% endif %}">
                        Mode: <strong>{{ mode }}</strong> (Click to Switch)
                    </button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
