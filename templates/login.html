{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4>Demo 1: Authentication Bypass</h4>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="e.g., admin' OR '1'='1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Any password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                {% if query %}
                <div class="mt-3 p-2 bg-dark text-warning rounded">
                    <small><strong>SQL Query Executed:</strong><br><code>{{ query }}</code></small>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
