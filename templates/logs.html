{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">
        <h4>Demo 4: Detection & Security Event Logging</h4>
    </div>
    <div class="card-body">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Timestamp</th>
                    <th>Endpoint</th>
                    <th>Payload / Input</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log['id'] }}</td>
                    <td>{{ log['timestamp'] }}</td>
                    <td><code>{{ log['endpoint'] }}</code></td>
                    <td><code>{{ log['request_payload'] }}</code></td>
                    <td>
                        <span class="badge {% if 'SUSPICIOUS' in log['status'] %}bg-danger{% else %}bg-success{% endif %}">
                            {{ log['status'] }}
                        </span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
